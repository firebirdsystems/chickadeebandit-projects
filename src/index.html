<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 8px);
      --red: #b91c1c;
      --red-soft: #fee2e2;
      --green: #15803d;
      --green-soft: #dcfce7;
      --amber: #854d0e;
      --amber-soft: #fef9c3;
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }
    .app { max-width: 720px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    h2 { font-size: 1.05rem; line-height: 1.25; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 10px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .card-link { cursor: pointer; }
    .card-link:hover { border-color: var(--border-mid); }
    .item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .item-title { font-weight: 700; }
    .item-meta { margin-top: 2px; color: var(--muted); font-size: .8rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--border-mid); border-radius: 8px; padding: 8px 12px;
      font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer;
      min-height: 38px; background: var(--surface); color: var(--text);
    }
    .btn:hover { background: var(--bg); }
    .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn-sm { min-height: 30px; padding: 4px 8px; font-size: .78rem; }
    .btn-back { background: none; border: 0; padding: 4px 0; font: inherit; font-size: .84rem; font-weight: 700; color: var(--muted); cursor: pointer; }
    .btn-back:hover { color: var(--text); }
    .btn-quiet-danger {
      min-height: 28px; padding: 3px 8px; background: transparent; color: var(--muted);
      border: 0; font-size: .76rem; font-weight: 700; cursor: pointer;
    }
    .btn-quiet-danger:hover { background: var(--red-soft); color: var(--red); }
    .btn-add {
      width: 100%; border: 1.5px dashed var(--border-mid); background: none; color: var(--muted);
      border-radius: 8px; padding: 10px; font: inherit; font-size: .84rem; font-weight: 700; cursor: pointer;
    }
    .btn-add:hover { border-color: var(--accent); color: var(--text); }
    .row-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    .field { display: grid; gap: 4px; margin-bottom: 12px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    input, textarea, select {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    textarea { min-height: 70px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    .check-line { display: flex; align-items: center; gap: 8px; }
    .check-line input { width: auto; }
    .check-line label { text-transform: none; letter-spacing: 0; font-size: .86rem; font-weight: 600; color: var(--text); }
    .search-row { margin-bottom: 12px; }
    .search-input { width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px; padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text); }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .empty, .loading { color: var(--muted); text-align: center; padding: 28px 16px; }
    .empty-icon { font-size: 1.8rem; margin-bottom: 6px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: .72rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .badge-planning { background: #f3f4f6; color: #6b7280; }
    .badge-active   { background: #dbeafe; color: #1d4ed8; }
    .badge-on_hold  { background: var(--amber-soft); color: var(--amber); }
    .badge-done     { background: var(--green-soft); color: var(--green); }
    .badge-over     { background: var(--red-soft); color: var(--red); }
    .badge-private  { background: #ede9fe; color: #7c3aed; }
    .badge-overdue  { background: var(--red-soft); color: var(--red); }

    .progress-bar { height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .3s; }
    .progress-fill.is-over { background: var(--red); }

    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; gap: 2px; overflow-x: auto; }
    .tab {
      background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 14px;
      font: inherit; font-size: .875rem; font-weight: 600; cursor: pointer; color: var(--muted);
      margin-bottom: -1px; white-space: nowrap;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }

    .stat-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
    .stat-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    .stat-value { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat-value.is-over { color: var(--red); }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; padding: 8px 10px; background: var(--bg); }
    td { padding: 10px; border-bottom: 1px solid var(--border); font-size: .88rem; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .amount-col { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .actions-col { text-align: right; white-space: nowrap; width: 1%; }
    .table-wrap { overflow-x: auto; }

    .list-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .list-item:last-child { border-bottom: none; }
    .list-item.is-done .list-label { text-decoration: line-through; opacity: .45; }
    .list-body { flex: 1; min-width: 0; }
    .list-label { font-weight: 600; }
    .checkbox {
      width: 22px; height: 22px; flex-shrink: 0; margin-top: 1px;
      border: 1.5px solid var(--border-mid); border-radius: 6px; background: var(--surface);
      cursor: pointer; font-size: .8rem; line-height: 1; color: transparent; padding: 0;
    }
    .checkbox.is-checked { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .milestone-flag { font-size: .78rem; }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .photo { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo button { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 6px; padding: 2px 7px; font: inherit; font-size: .74rem; font-weight: 700; cursor: pointer; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
    }
    .modal {
      background: var(--surface); border-radius: var(--hub-radius, 12px); padding: 24px;
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }
    .modal-sub { font-size: .83rem; color: var(--muted); margin-top: -8px; margin-bottom: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  </style>
  <base href="/run/projects/">
</head>
<body>
<div class="app">
  <div id="root" class="loading">Loading…</div>
</div>

<script type="module">
import {
  esc, hubConfirm, hubAlert, hubToday, searchMatch, formatRelativeDate,
  createFilesHelper, createDbHelper, createEventsHelper, logHubActivity,
} from "/hub-sdk.js";
import {
  STATUSES, STATUS_LABELS, VISIBILITY_LABELS,
  toCents, fmtDollars, centsInput,
  summaryFromRows, summaryFromAggregates, applyDelta, committedOf,
  budgetStatusFrom, progressFrom, crossedCap, navigationGate,
  sortChecklist, isOverdue,
  completionIndex, completionOf,
  mayPublish, assignableMembers,
  writeOrThrow, rewriteFileIds, parseFileIds, publishBestEffort,
  toggleDecision, announcedMilestoneIds,
  chunk, D1_MAX_BINDS, CHILD_ORDERS, cursorFrom, keysetClause,
  mergeById, mergeSorted, compareBudgetRows, compareNoteRows, compareProjectRows,
  shouldRepaint, loadProjectTail,
  canSeeProject, canEditProject, canDeleteProject, canAddChild, canEditChild,
  canCompleteItem, canUncompleteItem, visibilityChoicesFor, isUndeletableWhilePrivate,
  searchableFields, configureTenant,
} from "./logic.js";

// ── Hub runtime globals (empty in demo mode) ─────────────────────────────────
const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL ?? "";
const EVENTS  = window.__EVENTS_URL ?? "";
const APP_ID  = window.__APP_ID ?? "projects";
const files   = createFilesHelper(window.__FILES_URL ?? "");

/** The hub stamps the viewer onto the document; outside it there is no session.
 *  Demo mode still needs somebody to BE, though — every gate in logic.js is
 *  written against a member, so a null viewer owns nothing, is not an adult,
 *  and filters the seeded project straight back out of the list. Standing in
 *  as the demo project's owner is what makes the demo show its own data. */
const ME = window.__CURRENT_MEMBER ?? (DB ? null : { id: "demo-1", name: "Alex", role: "adult" });

/** In a shared space every member is an adult, so the `adults_bypass` reach over
 *  other members' rows belongs to the steward alone — the gates in logic.js
 *  must know which tenant they are in, or a non-steward is shown edit and
 *  delete controls the hub then refuses. Unset globals mean a household. */
configureTenant({ kind: window.__TENANT_KIND, isAdmin: window.__IS_ADMIN });

// ── First-render reads ───────────────────────────────────────────────────────
// Declared once here and mirrored byte-for-byte in manifest.preload, so the hub
// can answer this batch from the rows it embedded in the document and the first
// paint costs no round trip. __tests__/preload.test.mjs pins the two copies
// together — a drifted copy is not an error, it is a preload that silently
// never answers.
//
// The three child reads are scoped to open projects through a JOIN on their
// parent. That bounds a read the hub runs on every launch for every household,
// and it is deliberately a JOIN rather than a subquery: the row-policy rewriter
// rewrites governed tables named at the top level and fails closed on one that
// appears only inside a subquery.
const LOCAL_READS = {
  "projects": "SELECT * FROM app_projects__projects ORDER BY (completed_at IS NULL) DESC, (target_date IS NULL), target_date, created_at LIMIT 100",
  "budget": "SELECT b.* FROM app_projects__budget_items b JOIN app_projects__projects p ON p.id = b.project_id WHERE p.completed_at IS NULL ORDER BY b.project_id, b.sort_order, b.created_at LIMIT 500",
  "checklist": "SELECT c.* FROM app_projects__checklist_items c JOIN app_projects__projects p ON p.id = c.project_id WHERE p.completed_at IS NULL ORDER BY c.project_id, c.sort_order, c.created_at LIMIT 500",
  "notes": "SELECT n.* FROM app_projects__notes n JOIN app_projects__projects p ON p.id = n.project_id WHERE p.completed_at IS NULL ORDER BY n.project_id, n.created_at DESC LIMIT 200",
  "completions": "SELECT x.* FROM app_projects__checklist_completions x JOIN app_projects__projects p ON p.id = x.project_id WHERE p.completed_at IS NULL ORDER BY x.project_id, x.done_at LIMIT 500"
};

/**
 * The three aggregate reads behind every stated total.
 *
 * Every number this app states as a fact — the committed spend, "3/7 done", the
 * tab counts, and the `committed_cents` it publishes on project.completed and
 * project.budget_exceeded — comes from here rather than from the rows on
 * screen. The rows on screen are one page: the child reads cap at 200 per tab,
 * the preload caps across the whole household, and a finished project's
 * children are not preloaded at all. Counting those rows understated every one
 * of those numbers with nothing to say so.
 *
 * Grouped over the household rather than fetched per project: one round trip
 * settles every card in the list, including the finished projects whose rows
 * are never loaded at all. They are deliberately NOT preloads — the manifest is
 * at its six-statement ceiling, and the first paint does not need them.
 *
 * `committed_cents` mirrors `budgetTotals` exactly: the real price where one is
 * known, the estimate elsewhere. Both columns are INTEGER cents, so they are
 * plaintext and SUM-able — a TEXT column here would be ciphertext and would sum
 * to nothing, in silence.
 *
 * They count rows THIS VIEWER may see: row policies rewrite these like any
 * other read, so an adults-only project's spend is not counted for a child.
 */
const SUMMARY_READS = {
  budget: "SELECT project_id, COUNT(*) AS line_items, COALESCE(SUM(COALESCE(actual_cents, estimated_cents)), 0) AS committed_cents, COALESCE(SUM(estimated_cents), 0) AS estimated_cents FROM app_projects__budget_items GROUP BY project_id",
  checklist: "SELECT c.project_id AS project_id, COUNT(*) AS items, COUNT(x.id) AS done FROM app_projects__checklist_items c LEFT JOIN app_projects__checklist_completions x ON x.item_id = c.id GROUP BY c.project_id",
  notes: "SELECT project_id, COUNT(*) AS notes FROM app_projects__notes GROUP BY project_id",
};

/** Every preload's row cap, keyed the same way. A result that comes back at its
 *  cap was TRUNCATED, and the projects past the cut have no children loaded —
 *  see loadProjects. */
const READ_LIMITS = { projects: 100, budget: 500, checklist: 500, notes: 200, completions: 500 };

// ── App state ────────────────────────────────────────────────────────────────
let members = [];
/** Whether the roster fetch has settled. First paint deliberately does not wait
 *  on it, so a form opened in that window must not mistake an EMPTY roster for
 *  a roster with nobody in it. */
let membersLoaded = false;
let memberMap = new Map();
let projects = [];
let budget = [];
let checklist = [];
let notes = [];
let completions = [];
let view = "list";              // "list" | "project"
let currentProjectId = null;
let currentTab = "budget";      // "budget" | "checklist" | "notes" | "photos"
let searchQ = "";
let error = "";
let modalEl = null;

// Projects whose children we already hold. The preload only carries children of
// OPEN projects, so opening a finished one fetches its rows once.
const childrenLoaded = new Set();

/**
 * projectId → its EXACT child totals, in two layers.
 *
 * `summaries` holds what this session knows for certain about one project: the
 * preload covered it in full, or a write moved a total we already held. The
 * aggregate maps under it answer for every OTHER project once the household-
 * wide read lands — including, importantly, the projects that have no children
 * at all, which appear in no aggregate row and are a real zero rather than an
 * unknown.
 *
 * Before that read lands there is no answer, and "no answer" is rendered as
 * nothing at all — never as a zero. An understated total is the failure this
 * whole arrangement exists to prevent, and a confident "$0 of $12,000" on a
 * project mid-renovation is the worst version of it.
 */
const summaries = new Map();
const aggregates = { loaded: false, budget: new Map(), checklist: new Map(), notes: new Map() };

function summaryOf(projectId) {
  const known = summaries.get(projectId);
  if (known) return known;
  if (!aggregates.loaded) return null;
  return summaryFromAggregates(
    aggregates.budget.get(projectId),
    aggregates.checklist.get(projectId),
    aggregates.notes.get(projectId),
  );
}

/** Move a total on by a write we just made. An exact base plus the exact delta
 *  of our own write is still exact, which is what saves a round trip per tick.
 *  An unknown base stays unknown — see `applyDelta`. */
function updateSummary(projectId, delta) {
  const next = applyDelta(summaryOf(projectId), delta);
  if (next) summaries.set(projectId, next);
}

/** Navigation identity, so a slower open cannot land on top of a faster one. */
const nav = navigationGate();

/** Checklist items with a tick/untick write in flight — see toggleChecklist. */
const togglesInFlight = new Set();

/** Milestone items whose `project.milestone_reached` has already gone out this
 *  session, so a mis-tick and its correction don't announce it twice. */
const announcedMilestones = new Set();

/**
 * Seed it from the completions on hand, on every load.
 *
 * The set alone was session-scoped, so a reload emptied it and the next
 * reopen-and-re-tick republished `project.milestone_reached` — re-running every
 * subscribed automation. Seeding means a milestone that is ALREADY closed is
 * never announced again, which is the case that actually recurs.
 *
 * What this still cannot see is a milestone deliberately reopened in one
 * session and re-closed in a later one: by then its completion row is genuinely
 * gone, and a second close is arguably a second event. Closing that gap needs a
 * durable per-item marker, and the only row that could carry one is the item,
 * which the person ticking it off may not write.
 */
function seedAnnouncedMilestones({ reset = true } = {}) {
  // `reset` only on a full refresh. An incremental load — another project's
  // children, or the next checklist page — must UNION: clearing would forget
  // that a milestone was already announced earlier in this session, so
  // reopening it and re-ticking would publish `project.milestone_reached` a
  // second time and re-run every subscribed automation.
  if (reset) announcedMilestones.clear();
  for (const id of announcedMilestoneIds(checklist, completions)) announcedMilestones.add(id);
}

function nowIso() { return new Date().toISOString(); }
function uuid() { return crypto.randomUUID(); }
function memberName(id) { return memberMap.get(id)?.name ?? "Someone"; }
function currentProject() { return projects.find(p => p.id === currentProjectId) ?? null; }
function jsArg(value) { return esc(JSON.stringify(String(value))); }

/** A yyyy-mm-dd built from parts — `new Date("2026-08-30")` is UTC midnight and
 *  renders as the 29th west of Greenwich. */
function fmtDate(value) {
  if (!value) return "";
  const [y, m, d] = String(value).split("-").map(Number);
  if (!y || !m || !d) return String(value);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}


/**
 * Children of a project, grouped once per version of each child array.
 *
 * The cache is a WeakMap keyed on the ARRAY ITSELF, which is what makes the
 * derived views self-invalidating: every mutation below REPLACES its array
 * (`[...budget, item]`, `.filter(...)`, `.concat(...)`) rather than splicing in
 * place, so a changed array is a new cache key and a stale group map is
 * unreachable. An index kept in a `let` and refreshed by hand is the shape that
 * rots — the next site to touch `completions` forgets the refresh call and the
 * checklist renders yesterday's done-state against today's rows, with no test
 * able to catch a missed call.
 *
 * It is also what keeps rendering cheap. These used to be full-array `filter`s
 * run per card per render: with 100 projects over 500 budget and 500 checklist
 * rows that is ~100,000 predicate evaluations and 100 sorts for one paint, and
 * the search box repeats the whole thing on every keystroke.
 *
 * Callers must treat the returned arrays as read-only — they are shared.
 */
const NO_ROWS = Object.freeze([]);
const groupCache = new WeakMap();
function groupedByProject(rows) {
  let map = groupCache.get(rows);
  if (map) return map;
  map = new Map();
  for (const row of rows) {
    const list = map.get(row.project_id);
    if (list) list.push(row); else map.set(row.project_id, [row]);
  }
  groupCache.set(rows, map);
  return map;
}

const sortedChecklistCache = new WeakMap();
function budgetOf(projectId) { return groupedByProject(budget).get(projectId) ?? NO_ROWS; }
function notesOf(projectId)  { return groupedByProject(notes).get(projectId) ?? NO_ROWS; }
function checklistOf(projectId) {
  let perProject = sortedChecklistCache.get(checklist);
  if (!perProject) { perProject = new Map(); sortedChecklistCache.set(checklist, perProject); }
  let sorted = perProject.get(projectId);
  if (!sorted) {
    sorted = sortChecklist(groupedByProject(checklist).get(projectId) ?? NO_ROWS);
    perProject.set(projectId, sorted);
  }
  return sorted;
}

/** item_id → the completion that closed it, derived from `completions` on the
 *  same self-invalidating basis as the group maps above. */
const doneCache = new WeakMap();
function doneIndex() {
  let map = doneCache.get(completions);
  if (!map) { map = completionIndex(completions); doneCache.set(completions, map); }
  return map;
}

/** Whether the viewer is the row's owner, which is what the `visibility`
 *  column's write ACL means by "owner". A project the automation created is
 *  owned by `"automation"` and so by nobody — the comparison is false for every
 *  member, which is exactly how the hub will judge it too. */
function isOwner(project) { return !!ME && project?.created_by === ME.id; }

function mayLogActivity(project) { return !!project && project.visibility === "everyone"; }

// ── DB ───────────────────────────────────────────────────────────────────────
// The SDK helper is the transport: the same single/batch request shapes and the
// same "a refused statement is HTTP 200 with an `error` body" check this app
// used to spell out, and it is where hub-side changes to the envelope land.
// `db.batch` resolves to the RESULTS ARRAY (not `{ results }`), and answers
// demo mode with one `{ rows: [], changed: 0 }` stub per statement.
const db = createDbHelper(DB);
const events = createEventsHelper(EVENTS, APP_ID);

/**
 * A write that MUST land. `/api/db` answers a policy-narrowed statement with
 * `changed: 0` and HTTP 200 — no error to catch — so a caller that assumed
 * success would update the screen and let the change evaporate on next load.
 * Every write below goes through this rather than `db` directly.
 */
const dbWrite = (sql, params, refusal) =>
  writeOrThrow(db, { sql, params, refusal, live: !!DB });

// ── Side effects (best-effort; the row is already written) ────────────────────
/** The app's (type, subject, payload) order over the SDK's publish, which takes
 *  the payload second. The SDK reports a catalog/schema rejection to the console
 *  instead of swallowing it: a mis-shaped payload used to publish nothing and
 *  tell nobody. */
/**
 * Publishing is best-effort, but the promise may not be dropped on the floor:
 * `events.publish` awaits a bare `fetch`, so a network failure REJECTS, and a
 * discarded rejection is an unhandled one. Dropping it also let navigation
 * cancel the request after the row was already written, leaving the database
 * and the bus disagreeing with nothing logged anywhere.
 *
 * Callers `await` this. It never rejects, so nothing downstream has to guard.
 */
const publishEvent = (type, subjectId, payload = {}) =>
  publishBestEffort(events, type, subjectId, payload,
    (msg, e) => console.warn(`[projects] ${msg}:`, e));

/**
 * One household-feed line about a project, gate included.
 *
 * The gate lives in here rather than at each call site because "a private
 * project never reaches the feed" is an invariant, and an invariant every
 * future call site has to remember is just a convention.
 *
 * `logHubActivity` is the SDK's: it posts the runtime's own `app_activity` type
 * to `window.__ACTIVITY_URL`, which stamps this app's id on the row. A
 * hand-rolled POST of a `project_*` type to `/api/activity` — which is what
 * this app did — is refused 403 by the hub (that route admits a fixed list of
 * caller types, none of them ours) and swallowed by the `.catch`, so every feed
 * line was silently dropped; contract-ci fails the release for exactly that
 * shape.
 */
function logProjectActivity(project, description) {
  if (!mayLogActivity(project)) return;
  logHubActivity(description, { deepLink: { appId: APP_ID, params: { projectId: project.id } } });
}

/**
 * The projects whose children a child-preload really carried.
 *
 * Each child read is capped, and the caps are shared across every open project.
 * Past the cap the rows simply stop — ordered by project_id, so it is the tail
 * of that ordering that goes missing. Marking every open project "loaded"
 * regardless (which is what this used to do) meant `ensureChildren` never
 * repaired them and the tabs rendered "No line items yet" over data that was
 * really there. A result sitting exactly at its cap is treated as truncated,
 * and the last project_id in it is dropped too: it is the one that was cut
 * mid-project.
 */
function fullyLoadedFrom(rows, limit) {
  if (rows.length < limit) return null;              // null = "all of them"
  const ids = rows.map(r => r.project_id);
  const lastCut = ids[ids.length - 1];
  return new Set(ids.filter(id => id !== lastCut));
}

async function loadProjects() {
  if (!DB) { demoData(); return; }
  const [projectsRes, budgetRes, checklistRes, notesRes, completionsRes] =
    await db.batch(Object.values(LOCAL_READS).map(sql => ({ sql, params: [] })));
  // Sorted here too, so the list's order comes from ONE comparator rather than
  // from whichever read happened to deliver a row (preload, tail, or a local
  // insert). The preload already returns this order; sorting makes it explicit.
  projects    = mergeSorted([], projectsRes.rows ?? [], compareProjectRows);
  budget      = budgetRes.rows ?? [];
  checklist   = checklistRes.rows ?? [];
  notes       = notesRes.rows ?? [];
  completions = completionsRes.rows ?? [];

  // A project counts as loaded only when EVERY child read covered it.
  const covered = [
    fullyLoadedFrom(budget, READ_LIMITS.budget),
    fullyLoadedFrom(checklist, READ_LIMITS.checklist),
    fullyLoadedFrom(notes, READ_LIMITS.notes),
    fullyLoadedFrom(completions, READ_LIMITS.completions),
  ];
  childrenLoaded.clear();
  childCursors.clear();
  childLoading.clear();
  childMore.clear();
  summaries.clear();
  for (const p of projects) {
    if (p.completed_at) continue;                    // its children never preload
    if (!covered.every(set => set === null || set.has(p.id))) continue;
    childrenLoaded.add(p.id);
    // Covered in full by the preload, so the rows on hand ARE all of them and
    // this project's totals are settled before any aggregate read returns.
    // Every other project — finished ones, and any past a cap — states no
    // totals until `loadSummaries` lands.
    summaries.set(p.id, summaryFromRows(budgetOf(p.id), checklistOf(p.id), doneIndex(), notesOf(p.id)));
  }
  seedAnnouncedMilestones();
}

/**
 * The rest of the projects, when the preload came back at its own cap.
 *
 * The child reads have `fullyLoadedFrom` + `ensureChildren` to repair a
 * truncated result, but the projects read had neither, and it is the one that
 * cannot be repaired lazily: a project missing from this list has no card to
 * click, so nothing would ever ask for it. Because finished projects sort last,
 * the rows that fell off the cut were the oldest completed ones — a household's
 * finished renovation and its photos, silently absent from an app whose whole
 * premise is keeping that record.
 *
 * Paged rather than one big read so the common case (under the cap) costs
 * nothing at all, and the tail arrives after first paint.
 */
async function loadRemainingProjects(onPage) {
  if (!DB || projects.length < READ_LIMITS.projects) return;
  // Inline integer: `LIMIT ?` is refused at manifest admission, so the paged
  // form is built as text. The value is ours, never user input.
  await loadProjectTail(
    {
      db,
      sql: `SELECT * FROM app_projects__projects WHERE id > ? ORDER BY id LIMIT ${READ_LIMITS.projects}`,
      pageSize: READ_LIMITS.projects,
    },
    projects.map(p => p.id),
    // Each page is merged into the list as it stands NOW, not into a copy taken
    // when the loader started — a project created here, or fetched by a deep
    // link, must survive the next page landing. Progress then goes through the
    // CALLER's guarded repaint: rendering from inside the loader bypassed that
    // guard and replaced the search box under the caret, once per page.
    (rows) => { projects = mergeSorted(projects, rows, compareProjectRows); onPage?.(); },
  );
}

/**
 * One page of a project's children.
 *
 * `max_rows` permits 20,000 rows per child table, and this read used to have no
 * `LIMIT` at all: opening one long-running or finished project asked for tens
 * of thousands of encrypted rows in a single batch, which is a freeze or a
 * response-size failure, not a slow render. Pages are small and explicit, and
 * each tab offers the next one.
 */
const CHILD_PAGE = 200;

/** projectId → the last row held of each child table, as a keyset cursor. */
const childCursors = new Map();
/** `${projectId}:${key}` currently fetching. A second click while a page is in
 *  flight is ignored rather than issuing the same read twice. */
const childLoading = new Set();
/** projectId → the child tables with more rows waiting on the server. */
const childMore = new Map();

function cursorsFor(projectId) {
  let at = childCursors.get(projectId);
  if (!at) { at = { budget: null, checklist: null, notes: null }; childCursors.set(projectId, at); }
  return at;
}

function isLoadingChildren(projectId, key) {
  return childLoading.has(`${projectId}:${key}`);
}

function hasMoreChildren(projectId, key) {
  return childMore.get(projectId)?.has(key) ?? false;
}

function noteMore(projectId, key, rows) {
  let set = childMore.get(projectId);
  if (!set) { set = new Set(); childMore.set(projectId, set); }
  if (rows.length === CHILD_PAGE) set.add(key); else set.delete(key);
}

/**
 * Completions are NOT paged on their own. A completion exists for at most one
 * item, so fetching them by the item ids just loaded keeps done-ness exactly
 * right for everything on screen — where two independent pages would drift and
 * quietly render a closed item as open.
 *
 * Chunked at `D1_MAX_BINDS - 1`: D1 refuses a statement carrying more than 100
 * bound parameters, and one bind here is the project id. A full page of 200
 * items in one `IN (…)` was 201 binds, so any project with ~100 checklist items
 * failed to open at all.
 */
async function completionsForItems(projectId, itemIds) {
  if (!itemIds.length) return [];
  const groups = chunk(itemIds, D1_MAX_BINDS - 1);
  const results = await db.batch(groups.map(ids => ({
    sql: `SELECT * FROM app_projects__checklist_completions WHERE project_id = ? AND item_id IN (${ids.map(() => "?").join(", ")})`,
    params: [projectId, ...ids],
  })));
  return results.flatMap(r => r.rows ?? []);
}

/** One page of `key` for a project, resuming after `cursor` (null = from the top). */
function childPageRead(projectId, key, cursor) {
  const spec = CHILD_ORDERS[key];
  const resume = keysetClause(key, cursor);
  return {
    sql: `SELECT * FROM app_projects__${spec.table} WHERE project_id = ?${resume.sql}`
       + ` ORDER BY ${spec.order} LIMIT ${CHILD_PAGE}`,
    params: [projectId, ...resume.params],
  };
}

/** Records where this page ended, and whether another may follow. */
function noteCursor(projectId, key, rows) {
  const at = cursorsFor(projectId);
  if (rows.length) at[key] = cursorFrom(rows[rows.length - 1], key);
  noteMore(projectId, key, rows);
}

/** The preload only carries children of open projects, and only up to its own
 *  caps; fetch the first page for anything it did not cover. */
async function ensureChildren(projectId) {
  if (!DB || childrenLoaded.has(projectId)) return;
  const at = cursorsFor(projectId);
  at.budget = at.checklist = at.notes = null;
  const [b, c, n] = await db.batch(
    ["budget", "checklist", "notes"].map(key => childPageRead(projectId, key, null)),
  );
  const bRows = b.rows ?? [], cRows = c.rows ?? [], nRows = n.rows ?? [];
  const xRows = await completionsForItems(projectId, cRows.map(r => r.id));

  // This project's rows are replaced wholesale (its first page), then the array
  // is re-sorted so display order never depends on arrival order.
  budget      = mergeSorted(budget.filter(r => r.project_id !== projectId), bRows, compareBudgetRows);
  checklist   = mergeById(checklist.filter(r => r.project_id !== projectId), cRows);
  notes       = mergeSorted(notes.filter(r => r.project_id !== projectId), nRows, compareNoteRows);
  completions = mergeById(completions.filter(r => r.project_id !== projectId), xRows);

  noteCursor(projectId, "budget", bRows);
  noteCursor(projectId, "checklist", cRows);
  noteCursor(projectId, "notes", nRows);
  // Additive: this project's closed milestones join what other projects already
  // contributed. Clearing here would forget an announcement made earlier in the
  // session and let a reopened milestone announce itself twice.
  seedAnnouncedMilestones({ reset: false });
  childrenLoaded.add(projectId);
}

/**
 * The next page of one tab.
 *
 * Guarded per project+tab: `render()` only runs once the read resolves, so
 * without this a double-tap issued the same read twice, appended the page
 * twice, and — under the old OFFSET paging — advanced the offset twice, which
 * also skipped a page. Keyset paging makes the repeat harmless on its own; the
 * guard keeps it from being wasteful and keeps the button honestly disabled.
 */
async function loadMoreChildren(projectId, key) {
  if (!DB || !hasMoreChildren(projectId, key)) return;
  if (isLoadingChildren(projectId, key)) return;
  const marker = `${projectId}:${key}`;
  childLoading.add(marker);
  render();                                    // paint the button as busy
  try {
    const read = childPageRead(projectId, key, cursorsFor(projectId)[key]);
    const { rows = [] } = await db(read.sql, read.params);
    // Merged by id, never concatenated: a row added locally since the last page
    // sorts after the cursor, so this fetch returns it again — and a blind
    // concat put a second copy in the array, which double-counted in the budget
    // totals.
    if (key === "budget") budget = mergeSorted(budget, rows, compareBudgetRows);
    if (key === "notes") notes = mergeSorted(notes, rows, compareNoteRows);
    if (key === "checklist") {
      checklist = mergeById(checklist, rows);
      completions = mergeById(completions, await completionsForItems(projectId, rows.map(r => r.id)));
      seedAnnouncedMilestones({ reset: false });
    }
    noteCursor(projectId, key, rows);
  } catch (e) {
    hubAlert("Could not load more.", { description: e.message });
  } finally {
    childLoading.delete(marker);
    render();
  }
}

/**
 * A late repaint, skipped while the user is mid-interaction.
 *
 * Rendering re-creates #root, so a background load finishing while someone is
 * typing in Search would replace that input and take the caret with it. Every
 * repaint that is NOT user-initiated goes through here.
 */
function guardedRepaint() {
  if (!shouldRepaint({ modalOpen: !!modalEl, activeElementId: document.activeElement?.id ?? null })) return;
  render();
}

async function refresh() {
  error = "";
  try {
    await loadProjects();
  } catch (e) {
    error = e.message;
  }
  // First paint waits on the projects read alone, which the preload answers
  // from rows already embedded in the document — no round trip. The roster is
  // a real fetch, and the list view never names a member (names appear only in
  // the checklist and decisions tabs and the assignee picker), so waiting on it
  // here bought nothing and cost every launch a full round trip before anything
  // appeared. Repaint when the names land, and again when the tail arrives.
  render();
  loadMembers().then(guardedRepaint).catch(() => {});
  // Totals land after the first paint: the cards render without them rather
  // than the whole app waiting on a read that only fills in numbers.
  summariesReady = loadSummaries().then(guardedRepaint).catch(() => {});
  loadRemainingProjects(guardedRepaint)
    .then(guardedRepaint)
    .catch(e => { error = e.message; guardedRepaint(); });
}

/**
 * The household's child totals, in one batch, once per load.
 *
 * Kicked off after the first paint and awaited by anything that needs a total
 * to be exact — opening a project, publishing an event. In the common case it
 * has long since resolved and awaiting it costs nothing; in the worst case a
 * project opened in the first moments waits for one read it would otherwise
 * have raced.
 *
 * A failure here is left as silence rather than an error: totals stay unknown,
 * which every reader already renders as nothing. It is a wrong number this is
 * protecting against, and no number is not one.
 */
let summariesReady = null;

async function loadSummaries() {
  if (!DB) return;
  const [budgetRes, checklistRes, notesRes] = await db.batch(
    [SUMMARY_READS.budget, SUMMARY_READS.checklist, SUMMARY_READS.notes].map(sql => ({ sql, params: [] })),
  );
  const index = (rows, into) => {
    for (const row of rows ?? []) into.set(row.project_id, row);
  };
  index(budgetRes.rows, aggregates.budget);
  index(checklistRes.rows, aggregates.checklist);
  index(notesRes.rows, aggregates.notes);
  // Set last: until this flips, `summaryOf` answers "not known" for everything
  // the preload did not already settle, so a half-filled map is never read.
  aggregates.loaded = true;
}

// ── Navigation ───────────────────────────────────────────────────────────────
/**
 * Opening a project waits on reads, so two opens race. Tapping A and then B
 * showed B and then jumped back to A when A's slower read landed — and `goBack`
 * lost the same race against an open still in flight. Each navigation takes a
 * token; a read that finishes after a newer one started is dropped, error and
 * all. See `navigationGate`.
 *
 * The two reads are concurrent rather than sequential: the children and the
 * totals answer different questions and neither depends on the other.
 */
async function openProject(id) {
  const project = projects.find(p => p.id === id);
  if (!project) return;
  const token = nav.begin();
  try {
    await Promise.all([ensureChildren(id), summariesReady]);
  } catch (e) {
    if (!nav.current(token)) return;
    error = e.message;
  }
  if (!nav.current(token)) return;
  currentProjectId = id;
  currentTab = "budget";
  view = "project";
  render();
}

function goBack() {
  nav.begin();                    // invalidates an open still in flight
  view = "list";
  currentProjectId = null;
  error = "";
  render();
}

function render() {
  const root = document.getElementById("root");
  root.className = "";
  const project = currentProject();
  root.innerHTML = (view === "project" && project) ? renderProject(project) : renderList();
  if (view === "project" && !project) { view = "list"; currentProjectId = null; }
}

// ── List view ────────────────────────────────────────────────────────────────
function statusBadge(status) {
  return `<span class="badge badge-${esc(status)}">${esc(STATUS_LABELS[status] ?? status)}</span>`;
}

function projectCard(project) {
  // Totals come from the summary, never from the rows on hand: a card is drawn
  // for every project in the list, including ones whose children were never
  // fetched, and counting those rows showed a real budget as "$0 of $12,000".
  // No summary means no money line at all until one is known.
  const summary = summaryOf(project.id);
  const money = budgetStatusFrom(project, summary?.committedCents ?? null);
  const progress = progressFrom(summary);
  const meta = [];
  if (project.target_date) meta.push(`Aiming for ${fmtDate(project.target_date)}`);
  if (progress) meta.push(`${progress.done}/${progress.total} done`);
  if (money) meta.push(`${fmtDollars(money.committedCents)} of ${fmtDollars(money.capCents)}`);
  else if (summary?.lineItems) meta.push(`${fmtDollars(summary.committedCents)} budgeted`);

  return `
    <article class="card card-link" data-testid="project-card" data-project-id="${esc(project.id)}"
             onclick="openProjectById(${jsArg(project.id)})">
      <div class="item-head">
        <div>
          <div class="item-title" data-testid="project-name">${esc(project.name)}</div>
          ${project.description ? `<div class="item-meta">${esc(project.description)}</div>` : ""}
          ${meta.length ? `<div class="item-meta tiny">${esc(meta.join(" · "))}</div>` : ""}
        </div>
        <div class="row-actions">
          ${project.visibility === "private" ? `<span class="badge badge-private">Only me</span>` : ""}
          ${money && money.over ? `<span class="badge badge-over">Over budget</span>` : ""}
          ${statusBadge(project.status)}
        </div>
      </div>
      ${money ? `
        <div class="progress-bar">
          <div class="progress-fill${money.over ? " is-over" : ""}" style="width:${money.pct}%"></div>
        </div>` : ""}
    </article>
  `;
}

function visibleProjects() {
  const list = projects.filter(p => canSeeProject(p, ME));
  if (!searchQ) return list;
  return list.filter(p => searchMatch(searchQ, searchableFields(p)));
}

function renderProjectList() {
  const list = visibleProjects();
  if (!list.length) {
    if (searchQ) return `<div class="card empty"><div class="empty-icon">🔍</div><p>No projects match "${esc(searchQ)}".</p></div>`;
    return `<div class="card empty" data-testid="empty-state">
      <div class="empty-icon">🔨</div>
      <p>No projects yet. Start one for the next big thing — a renovation, a move, a trip fund.</p>
    </div>`;
  }
  return list.map(projectCard).join("");
}

function renderList() {
  return `
    <div class="topbar">
      <div>
        <h1>Projects</h1>
        <p class="muted tiny">Budgets, checklists and decisions for the big things.</p>
      </div>
      <button class="btn btn-primary btn-sm" type="button" onclick="openNewProject()" data-testid="new-project">New project</button>
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${projects.length ? `
      <div class="search-row">
        <input id="search" class="search-input" type="search" placeholder="Search projects…" aria-label="Search projects" value="${esc(searchQ)}" />
      </div>` : ""}
    <section class="stack" id="project-list">${renderProjectList()}</section>
  `;
}

// ── Project view ─────────────────────────────────────────────────────────────
function renderProject(project) {
  const summary = summaryOf(project.id);
  const money = budgetStatusFrom(project, summary?.committedCents ?? null);
  const canEdit = canEditProject(project, ME);

  return `
    <button class="btn-back" type="button" onclick="goBackToList()">← All projects</button>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    <div class="topbar" style="margin-top:8px">
      <div>
        <h1 data-testid="project-title">${esc(project.name)}</h1>
        ${project.description ? `<p class="muted tiny">${esc(project.description)}</p>` : ""}
        <p class="muted tiny">
          ${statusBadge(project.status)}
          ${project.target_date ? ` · Aiming for ${esc(fmtDate(project.target_date))}` : ""}
          · ${esc(VISIBILITY_LABELS[project.visibility] ?? project.visibility)}
        </p>
      </div>
      ${canEdit ? `<button class="btn btn-sm" type="button" onclick="openEditProject()" data-testid="edit-project">Edit</button>` : ""}
    </div>

    <div class="card">
      <div class="stat-row">
        <div>
          <div class="stat-label">Committed</div>
          <div class="stat-value${money && money.over ? " is-over" : ""}" data-testid="committed">${esc(fmtDollars(summary ? summary.committedCents : null))}</div>
        </div>
        <div>
          <div class="stat-label">Budget</div>
          <div class="stat-value">${esc(money ? fmtDollars(money.capCents) : "—")}</div>
        </div>
        <div>
          <div class="stat-label">${money ? (money.over ? "Over by" : "Left") : "Estimated"}</div>
          <div class="stat-value${money && money.over ? " is-over" : ""}">
            ${esc(money ? fmtDollars(Math.abs(money.remainingCents)) : fmtDollars(summary ? summary.estimatedCents : null))}
          </div>
        </div>
      </div>
      ${money ? `
        <div class="progress-bar">
          <div class="progress-fill${money.over ? " is-over" : ""}" style="width:${money.pct}%"></div>
        </div>` : `<p class="muted tiny" style="margin-top:8px">No budget set — add one from Edit to track spend against a cap.</p>`}
    </div>

    <div class="tabs" style="margin-top:16px">
      ${["budget", "checklist", "notes", "photos"].map(tab => `
        <button class="tab${currentTab === tab ? " active" : ""}" type="button"
                onclick="setTab(${jsArg(tab)})" data-testid="tab-${esc(tab)}">${esc(tabLabel(tab, project))}</button>
      `).join("")}
    </div>
    <div id="tab-content">${renderTab(project)}</div>
  `;
}

/** Counts are the summary's or they are omitted — a tab reading "Budget (200)"
 *  on a project with 900 line items is a number the app has no business
 *  stating. Photo ids live on the project row itself, so that count is always
 *  complete. */
function tabLabel(tab, project) {
  const summary = summaryOf(project.id);
  if (tab === "budget") return summary ? `Budget (${summary.lineItems})` : "Budget";
  if (tab === "checklist") {
    const progress = progressFrom(summary);
    return progress ? `Checklist (${progress.done}/${progress.total})` : "Checklist";
  }
  if (tab === "notes") return summary ? `Decisions (${summary.notes})` : "Decisions";
  return `Photos (${parseFileIds(project.file_ids).length})`;
}

// ── Checklist tab ────────────────────────────────────────────────────────────
function renderChecklistTab(project) {
  const items = checklistOf(project.id);
  const today = hubToday();
  const canAdd = canAddChild(project, ME);

  const rows = items.map(item => {
    const completion = completionOf(item, doneIndex());
    const done = !!completion;
    const overdue = isOverdue(item, today, doneIndex());
    // Ticking off needs only visibility of the project; reopening belongs to
    // whoever closed it. A checkbox nobody may press is disabled rather than
    // hidden, so a done item still reads as done.
    const pending = togglesInFlight.has(item.id);
    const mayToggle = !pending && (done
      ? canUncompleteItem(completion, project, ME)
      : canCompleteItem(project, ME));
    const meta = [];
    if (item.due_date) meta.push(`${done ? "Was due" : "Due"} ${fmtDate(item.due_date)}`);
    if (item.assignee_id) meta.push(memberName(item.assignee_id));
    if (done) meta.push(`Done by ${memberName(completion.done_by)}`);
    return `
      <div class="list-item${done ? " is-done" : ""}" data-testid="checklist-row" data-item-id="${esc(item.id)}">
        <button class="checkbox${done ? " is-checked" : ""}" type="button"${mayToggle ? "" : " disabled"}
                aria-label="${done ? "Mark not done" : "Mark done"}"
                title="${done && !mayToggle ? esc(`Only ${memberName(completion.done_by)} can reopen this`) : ""}"
                onclick="toggleChecklistItem(${jsArg(item.id)})">✓</button>
        <div class="list-body">
          <div class="list-label">
            ${Number(item.is_milestone) === 1 ? `<span class="milestone-flag">🚩</span> ` : ""}${esc(item.title)}
          </div>
          <div class="item-meta tiny">
            ${esc(meta.join(" · "))}
            ${overdue ? ` <span class="badge badge-overdue">Overdue</span>` : ""}
          </div>
        </div>
        ${canEditChild(item, project, ME) ? `
          <div class="row-actions">
            <button class="btn btn-sm" type="button" onclick="openEditChecklistItem(${jsArg(item.id)})">Edit</button>
            <button class="btn-quiet-danger" type="button" onclick="removeChecklistItem(${jsArg(item.id)})">Delete</button>
          </div>` : ""}
      </div>
    `;
  }).join("");

  return `
    ${items.length ? `<div class="card">${rows}</div>`
      : `<div class="card empty"><p>Nothing on the checklist yet. Add the phases and the jobs, and flag the ones that are real milestones.</p></div>`}

    ${canAdd ? `<button class="btn-add" type="button" style="margin-top:10px" onclick="openNewChecklistItem()">+ Add a checklist item</button>` : ""}
  `;
}

// ── Modal ────────────────────────────────────────────────────────────────────
// `name` is the dialog's identity for a test: this app has five modals, and a
// selector that waits on "any modal" waits on the wrong one as soon as a
// scenario opens two in a row.
function openModal(html, name) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal"${name ? ` data-testid="${esc(name)}"` : ""}>${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}

function closeModal() { modalEl?.remove(); modalEl = null; }

function busy(label) {
  const btn = modalEl?.querySelector(".modal-actions .btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = label; }
  return btn;
}

function unbusy(btn, label) {
  if (btn) { btn.disabled = false; btn.textContent = label; }
}

function field(id, label, input) {
  return `<div class="field"><label for="${id}">${esc(label)}</label>${input}</div>`;
}

function readProjectForm() {
  const name = document.getElementById("f-name").value.trim();
  if (!name) { document.getElementById("f-name").focus(); return null; }
  const budgetRaw = document.getElementById("f-budget").value.trim();
  let capCents = null;
  if (budgetRaw !== "") {
    capCents = toCents(budgetRaw);
    if (!Number.isInteger(capCents) || capCents < 0) { document.getElementById("f-budget").focus(); return null; }
  }
  return {
    name,
    description: document.getElementById("f-description").value.trim(),
    status: document.getElementById("f-status").value,
    target_date: document.getElementById("f-target").value || null,
    budget_cap_cents: capCents,
    visibility: document.getElementById("f-visibility").value,
  };
}

async function saveProject(isEdit) {
  const fields = readProjectForm();
  if (!fields) return;
  const btn = busy(isEdit ? "Saving…" : "Creating…");
  const now = nowIso();

  try {
    if (isEdit) {
      const project = currentProject();
      const wasDone = !!project.completed_at;
      const nowDone = fields.status === "done";
      const completedAt = nowDone ? (project.completed_at ?? now) : null;
      // `visibility` is named in the SET list ONLY by its owner. The column's
      // write ACL is `writable_by: ["owner"]`, and the hub counts a column as
      // written when it merely APPEARS in SET — the value being unchanged makes
      // no difference — then appends `AND created_by = <caller>` to the WHERE.
      // Sending it unconditionally therefore narrowed every non-owner's edit to
      // zero rows: the co-editing this table's `write_visibility_scoped` policy
      // exists to allow (another adult fixing a target date) came back as
      // `changed: 0` and surfaced as "This project could not be saved." A
      // project created by the automation is owned by nobody at all, so for
      // those it locked out the entire household, permanently.
      const owns = isOwner(project);
      const columns = ["name = ?", "description = ?", "status = ?", "target_date = ?",
                       "budget_cap_cents = ?", "completed_at = ?", "updated_at = ?"];
      const values = [fields.name, fields.description, fields.status, fields.target_date,
                      fields.budget_cap_cents, completedAt, now];
      if (owns) { columns.splice(3, 0, "visibility = ?"); values.splice(3, 0, fields.visibility); }
      await dbWrite(
        `UPDATE app_projects__projects SET ${columns.join(", ")} WHERE id = ?`,
        [...values, project.id],
        "This project could not be saved.",
      );
      // A non-owner never sent `visibility`, so the row still holds the old one.
      if (!owns) fields.visibility = project.visibility;
      Object.assign(project, fields, { completed_at: completedAt, updated_at: now });
      closeModal();
      render();
      if (!wasDone && nowDone && mayPublish(project)) {
        // The exact total, or the field is left off entirely. Summing the page
        // of line items in memory published a number that was simply wrong on
        // any project past a page — and this event is the one a household's
        // spending automations read.
        const committedCents = summaryOf(project.id)?.committedCents ?? null;
        await publishEvent("project.completed", project.id, {
          project_id: project.id, name: project.name,
          ...(committedCents === null ? {} : { committed_cents: committedCents }),
        });
        logProjectActivity(project, `Finished the project "${project.name}"`);
      }
    } else {
      const project = {
        id: uuid(), ...fields, file_ids: "[]",
        created_by: ME?.id ?? "unknown", created_at: now, updated_at: now,
        completed_at: fields.status === "done" ? now : null, source_event_id: null,
      };
      await db(
        `INSERT INTO app_projects__projects
           (id, name, description, status, visibility, target_date, budget_cap_cents, file_ids,
            created_by, created_at, updated_at, completed_at)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
        [project.id, project.name, project.description, project.status, project.visibility,
         project.target_date, project.budget_cap_cents, project.file_ids,
         project.created_by, project.created_at, project.updated_at, project.completed_at]
      );
      projects = mergeSorted(projects, [project], compareProjectRows);
      childrenLoaded.add(project.id);
      // A project created here has no children, and that is an EXACT total —
      // not an unknown one. Without this its own tabs would read "Budget" with
      // no count until the next load.
      summaries.set(project.id, summaryFromRows([], [], new Map(), []));
      closeModal();
      openProject(project.id);
      if (mayPublish(project)) {
        await publishEvent("project.created", project.id, {
          project_id: project.id, name: project.name,
          target_date: project.target_date, budget_cap_cents: project.budget_cap_cents,
        });
        logProjectActivity(project, `Started a project: "${project.name}"`);
      }
    }
  } catch (e) {
    unbusy(btn, isEdit ? "Save" : "Create project");
    hubAlert(isEdit ? "Could not save this project." : "Could not create this project.", { description: e.message });
  }
}

async function deleteProject() {
  const project = currentProject();
  if (!project || !canDeleteProject(project, ME)) return;
  const ok = await hubConfirm({
    message: `Delete "${project.name}"?`,
    description: "Its budget, checklist and decisions go with it. This cannot be undone.",
    confirmLabel: "Delete project",
    destructive: true,
  });
  if (!ok) return;
  try {
    // ONE statement, deliberately. The manifest declares `delete_cascades` and
    // `delete_file_list_columns` on this table, and the hub refuses a DELETE on
    // such a table inside a batch rather than stranding the children — it needs
    // to resolve the doomed ids per statement, which the batch form cannot do.
    // So the children and the photos are not this app's job: the cascade takes
    // budget items, checklist items, completions and decisions, and the
    // declared file-list column reclaims the photos.
    //
    // Deleting the children here would have been wrong even if it ran: they are
    // `inherit_visibility`, which scopes DELETE to the caller's own rows, so it
    // could only ever have removed the line items this member happened to write.
    await dbWrite(
      "DELETE FROM app_projects__projects WHERE id = ?", [project.id],
      "This project could not be deleted — it may already be gone.",
    );
    projects    = projects.filter(p => p.id !== project.id);
    budget      = budget.filter(b => b.project_id !== project.id);
    checklist   = checklist.filter(c => c.project_id !== project.id);
    notes       = notes.filter(n => n.project_id !== project.id);
    completions = completions.filter(x => x.project_id !== project.id);
    childrenLoaded.delete(project.id);
    summaries.delete(project.id);
    closeModal();
    goBack();
  } catch (e) {
    hubAlert("Could not delete this project.", { description: e.message });
  }
}
