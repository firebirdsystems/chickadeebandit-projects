async function saveBudgetItem(itemId) {
  const project = currentProject();
  if (!project) return;
  const label = document.getElementById("f-label").value.trim();
  if (!label) { document.getElementById("f-label").focus(); return; }
  const estimated = toCents(document.getElementById("f-estimate").value || "0");
  if (!Number.isInteger(estimated) || estimated < 0) { document.getElementById("f-estimate").focus(); return; }
  const actualRaw = document.getElementById("f-actual").value.trim();
  let actual = null;
  if (actualRaw !== "") {
    actual = toCents(actualRaw);
    if (!Number.isInteger(actual) || actual < 0) { document.getElementById("f-actual").focus(); return; }
  }
  const vendor = document.getElementById("f-vendor").value.trim();
  const purchased = document.getElementById("f-purchased").checked ? 1 : 0;

  const existing = itemId ? budget.find(b => b.id === itemId) : null;
  const btn = busy(itemId ? "Saving…" : "Adding…");
  const now = nowIso();

  // Both snapshots span the WHOLE line-item list — "before" as it stands now,
  // "after" with this item's new values folded in. Measuring "before" against
  // the items MINUS this one (the obvious way, since that is the set "after"
  // is built from) hides the item that blew the budget from the already-over
  // test: under a $10,000 cap with $6,000 and $5,000 lines, editing the $5,000
  // line's label saw $6,000 "not over" then $11,000 "over", and re-announced
  // the same overrun on every save.
  // Measured on the project's EXACT committed total, not on the page of line
  // items in memory. The old comparison walked the loaded rows, so on a project
  // past the 200-row page it compared two understated numbers: an overrun could
  // pass unannounced, and `committed_cents` went out on the event understated
  // to whatever automation was listening.
  const beforeCents = summaryOf(project.id)?.committedCents ?? null;
  const afterCents = beforeCents === null
    ? null
    : beforeCents - (existing ? committedOf(existing) : 0)
      + committedOf({ estimated_cents: estimated, actual_cents: actual });
  const crossed = crossedCap(project.budget_cap_cents, beforeCents, afterCents);

  const wasWorth = existing ? { estimated_cents: existing.estimated_cents, actual_cents: existing.actual_cents } : null;

  try {
    if (existing) {
      await dbWrite(
        `UPDATE app_projects__budget_items SET label = ?, vendor_name = ?, estimated_cents = ?,
         actual_cents = ?, purchased = ?, updated_at = ? WHERE id = ?`,
        [label, vendor, estimated, actual, purchased, now, itemId],
        "Only whoever added this line item can change it.",
      );
      Object.assign(existing, { label, vendor_name: vendor, estimated_cents: estimated, actual_cents: actual, purchased, updated_at: now });
      updateSummary(project.id, { before: wasWorth, after: { estimated_cents: estimated, actual_cents: actual } });
    } else {
      const sortOrder = budgetOf(project.id).length;
      const item = {
        id: uuid(), project_id: project.id, label, vendor_name: vendor,
        estimated_cents: estimated, actual_cents: actual, purchased, sort_order: sortOrder,
        created_by: ME?.id ?? "unknown", created_at: now, updated_at: now,
      };
      await db(
        `INSERT INTO app_projects__budget_items
           (id, project_id, label, vendor_name, estimated_cents, actual_cents, purchased, sort_order, created_by, created_at, updated_at)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
        [item.id, item.project_id, item.label, item.vendor_name, item.estimated_cents,
         item.actual_cents, item.purchased, item.sort_order, item.created_by, item.created_at, item.updated_at]
      );
      budget = mergeSorted(budget, [item], compareBudgetRows);
      updateSummary(project.id, { after: item });
    }
    closeModal();
    render();
    if (crossed && mayPublish(project)) {
      await publishEvent("project.budget_exceeded", project.id, {
        project_id: project.id, name: project.name,
        budget_cap_cents: project.budget_cap_cents, committed_cents: afterCents,
      });
    }
  } catch (e) {
    unbusy(btn, itemId ? "Save" : "Add item");
    hubAlert("Could not save this line item.", { description: e.message });
  }
}

async function deleteBudgetItem(itemId) {
  const project = currentProject();
  const item = budget.find(b => b.id === itemId);
  if (!project || !item) return;
  const ok = await hubConfirm({
    message: `Remove "${item.label}"?`, confirmLabel: "Remove", destructive: true,
  });
  if (!ok) return;
  try {
    await dbWrite("DELETE FROM app_projects__budget_items WHERE id = ?", [itemId],
      "Only whoever added this line item can remove it.");
    budget = budget.filter(b => b.id !== itemId);
    updateSummary(project.id, { before: item });
    render();
  } catch (e) {
    hubAlert("Could not remove this line item.", { description: e.message });
  }
}

// ── Checklist items ──────────────────────────────────────────────────────────
function checklistItemForm(item) {
  const c = item ?? {};
  return `
    <h2>${item ? "Edit item" : "New checklist item"}</h2>
    <p class="modal-sub">Assigning someone puts it on their own task list too, if the automation is switched on.</p>
    ${field("f-title", "What needs doing", `<input id="f-title" value="${esc(c.title ?? "")}" placeholder="Choose grout colour" />`)}
    <div class="field-row">
      ${field("f-due", "Due", `<input id="f-due" type="date" value="${esc(c.due_date ?? "")}" />`)}
      ${field("f-assignee", "Who", assigneeSelect(c))}
    </div>
    <div class="check-line" style="margin-bottom:4px">
      <input type="checkbox" id="f-milestone"${Number(c.is_milestone) === 1 ? " checked" : ""} />
      <label for="f-milestone">This is a milestone, not a chore</label>
    </div>
    <div class="modal-actions">
      <button class="btn" type="button" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" type="button" onclick="submitChecklistItem(${item ? jsArg(item.id) : "null"})">${item ? "Save" : "Add item"}</button>
    </div>
  `;
}

/**
 * The assignee picker.
 *
 * Until the roster lands the select is disabled and carries only the item's
 * CURRENT assignee. Rendering the usual "Nobody yet"-only list in that window
 * meant opening an item to fix its title, and silently writing
 * `assignee_id = null` on save — a destructive edit nobody asked for, and an
 * invisible one, since the late roster repaint is deliberately skipped while a
 * modal is open and so could never repair the form.
 */
function assigneeSelect(item) {
  const current = item?.assignee_id ?? null;
  if (!membersLoaded) {
    return `<select id="f-assignee" disabled data-roster="pending">`
      + (current
          ? `<option value="${esc(current)}" selected>${esc(memberName(current))}</option>`
          : `<option value="">Nobody yet</option>`)
      + `</select><p class="muted tiny">The family list has not loaded — reopen this to change who it is for.</p>`;
  }
  const options = assignableMembers(currentProject(), members);
  // A current assignee who is no longer assignable (they left, or the project's
  // visibility narrowed) still has to appear, or saving any other field would
  // quietly unassign them.
  const orphaned = current && !options.some(m => m.id === current);
  return `<select id="f-assignee"><option value="">Nobody yet</option>`
    + (orphaned ? `<option value="${esc(current)}" selected>${esc(memberName(current))}</option>` : "")
    + options.map(m => `<option value="${esc(m.id)}"${current === m.id ? " selected" : ""}>${esc(m.name)}</option>`).join("")
    + `</select>`;
}

async function saveChecklistItem(itemId) {
  const project = currentProject();
  if (!project) return;
  const title = document.getElementById("f-title").value.trim();
  if (!title) { document.getElementById("f-title").focus(); return; }
  const dueDate = document.getElementById("f-due").value || null;
  const assigneeField = document.getElementById("f-assignee");
  // A disabled picker means the roster never arrived: keep what the row already
  // says rather than writing the empty select over it.
  const existingRow = itemId ? checklist.find(c => c.id === itemId) : null;
  const assigneeId = assigneeField.disabled
    ? (existingRow?.assignee_id ?? null)
    : (assigneeField.value || null);
  const isMilestone = document.getElementById("f-milestone").checked ? 1 : 0;
  // The picker only offers members who can open the project, but a picker is
  // not a boundary — and an assignment to someone who cannot see the project
  // is the payload that used to leak its title onto their task list.
  const assigneeChanged = assigneeId !== (existingRow?.assignee_id ?? null);
  if (assigneeChanged && assigneeId && !assignableMembers(project, members).some(m => m.id === assigneeId)) {
    hubAlert("That person cannot see this project.", {
      description: "Share the project more widely first, or choose someone else.",
    });
    return;
  }

  const existing = existingRow;
  const previousAssignee = existing?.assignee_id ?? null;
  const btn = busy(itemId ? "Saving…" : "Adding…");
  const now = nowIso();
  let savedId = itemId;

  try {
    if (existing) {
      await dbWrite(
        `UPDATE app_projects__checklist_items SET title = ?, due_date = ?, assignee_id = ?,
         is_milestone = ?, updated_at = ? WHERE id = ?`,
        [title, dueDate, assigneeId, isMilestone, now, itemId],
        "Only whoever added this item can change it.",
      );
      Object.assign(existing, { title, due_date: dueDate, assignee_id: assigneeId, is_milestone: isMilestone, updated_at: now });
      // `is_milestone` and `due_date` are sort keys, so this edit can move the
      // row. Replace the array to retire the memoised ordering built from it —
      // mutating a row in place leaves the array identity, and therefore the
      // cached sort, untouched.
      checklist = [...checklist];
    } else {
      const item = {
        id: uuid(), project_id: project.id, title, due_date: dueDate, assignee_id: assigneeId,
        is_milestone: isMilestone, sort_order: checklistOf(project.id).length,
        created_by: ME?.id ?? "unknown", created_at: now, updated_at: now,
      };
      await db(
        `INSERT INTO app_projects__checklist_items
           (id, project_id, title, due_date, assignee_id, is_milestone, sort_order, created_by, created_at, updated_at)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
        [item.id, item.project_id, item.title, item.due_date, item.assignee_id,
         item.is_milestone, item.sort_order, item.created_by, item.created_at, item.updated_at]
      );
      checklist = mergeById(checklist, [item]);
      updateSummary(project.id, { checklist: 1 });
      savedId = item.id;
    }
    closeModal();
    render();
    // Only a NEW assignment is announced. Republishing on every later edit
    // would hand the assignee a duplicate task each time the title changed.
    if (assigneeId && assigneeId !== previousAssignee && mayPublish(project)) {
      await publishEvent("project.task_assigned", savedId, {
        project_id: project.id, project_name: project.name,
        title, assignee_id: assigneeId, due_date: dueDate,
      });
    }
  } catch (e) {
    unbusy(btn, itemId ? "Save" : "Add item");
    hubAlert("Could not save this item.", { description: e.message });
  }
}

/**
 * Ticking an item off INSERTs a completion the ticker owns; un-ticking DELETEs
 * it. Anyone who can see the project may close an item — which is what lets the
 * assignee close the one that was given to them — and only whoever closed it
 * can reopen it.
 */
async function toggleChecklist(itemId) {
  const project = currentProject();
  const item = checklist.find(c => c.id === itemId);
  if (!project || !item) return;
  // One toggle per item at a time. `render()` only runs after the write
  // resolves, so a double-tap had both handlers read the item as still open and
  // both INSERT: the second hit UNIQUE(item_id) and raised "Could not tick off
  // this item." over an item that was, in fact, ticked off. On the untick side
  // the second DELETE came back `changed: 0` and claimed the reopen failed.
  if (togglesInFlight.has(itemId)) return;
  togglesInFlight.add(itemId);
  render();                                   // paint the checkbox as disabled
  try {
    await toggleChecklistWrite(project, item);
  } finally {
    togglesInFlight.delete(itemId);
    render();
  }
}

async function toggleChecklistWrite(project, item) {
  const itemId = item.id;
  const decision = toggleDecision(item, project, ME, doneIndex(), memberName);

  if (decision.action === "denied") {
    error = decision.reason;
    render();
    return;
  }

  if (decision.action === "reopen") {
    const existing = decision.completion;
    try {
      await dbWrite(
        "DELETE FROM app_projects__checklist_completions WHERE id = ?", [existing.id],
        "This item could not be reopened.",
      );
      completions = completions.filter(x => x.id !== existing.id);
      updateSummary(project.id, { done: -1 });
      render();
    } catch (e) {
      hubAlert("Could not reopen this item.", { description: e.message });
    }
    return;
  }

  const now = nowIso();
  const completion = {
    id: uuid(), project_id: project.id, item_id: item.id,
    done_by: ME?.id ?? "unknown", done_at: now,
  };
  try {
    await dbWrite(
      `INSERT INTO app_projects__checklist_completions (id, project_id, item_id, done_by, done_at)
       VALUES (?, ?, ?, ?, ?)`,
      [completion.id, completion.project_id, completion.item_id, completion.done_by, completion.done_at],
      "This item could not be ticked off.",
    );
    completions = [...completions, completion];
    updateSummary(project.id, { done: 1 });
    // Announced once per item. Un-ticking a milestone that was flagged too
    // early and re-ticking it is a correction, not a second milestone, and
    // every re-announcement runs any automation subscribed to the event again.
    // Session-scoped deliberately: nothing durable records "already announced",
    // and inventing a column for it would need a write the item's non-owners
    // are not allowed to make.
    if (Number(item.is_milestone) === 1 && mayPublish(project) && !announcedMilestones.has(itemId)) {
      announcedMilestones.add(itemId);
      await publishEvent("project.milestone_reached", project.id, {
        project_id: project.id, project_name: project.name, title: item.title,
      });
      logProjectActivity(project, `Hit a milestone on "${project.name}": ${item.title}`);
    }
  } catch (e) {
    hubAlert("Could not tick off this item.", { description: e.message });
  }
}

async function deleteChecklistItem(itemId) {
  const item = checklist.find(c => c.id === itemId);
  if (!item) return;
  const ok = await hubConfirm({ message: `Remove "${item.title}"?`, confirmLabel: "Remove", destructive: true });
  if (!ok) return;
  try {
    await dbWrite(
      "DELETE FROM app_projects__checklist_items WHERE id = ?", [itemId],
      "Only whoever added this item can remove it.",
    );
    const wasDone = doneIndex().has(itemId);
    checklist = checklist.filter(c => c.id !== itemId);
    // The row's completion goes with it in the database (ON DELETE CASCADE);
    // drop it here so the screen agrees without a refetch.
    completions = completions.filter(x => x.item_id !== itemId);
    updateSummary(item.project_id, { checklist: -1, done: wasDone ? -1 : 0 });
    render();
  } catch (e) {
    hubAlert("Could not remove this item.", { description: e.message });
  }
}

// ── Notes ────────────────────────────────────────────────────────────────────
function noteForm() {
  return `
    <h2>Log a decision</h2>
    <p class="modal-sub">What you chose, and why — the reason is the part that gets lost.</p>
    ${field("f-body", "Decision", `<textarea id="f-body" placeholder="Went with the matte tile (model 4471), not the gloss — less slippery underfoot."></textarea>`)}
    <div class="modal-actions">
      <button class="btn" type="button" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" type="button" onclick="submitNote()">Log it</button>
    </div>
  `;
}

async function saveNote() {
  const project = currentProject();
  if (!project) return;
  const body = document.getElementById("f-body").value.trim();
  if (!body) { document.getElementById("f-body").focus(); return; }
  const btn = busy("Saving…");
  const now = nowIso();
  const note = { id: uuid(), project_id: project.id, body, created_by: ME?.id ?? "unknown", created_at: now };
  try {
    await db(
      "INSERT INTO app_projects__notes (id, project_id, body, created_by, created_at) VALUES (?, ?, ?, ?, ?)",
      [note.id, note.project_id, note.body, note.created_by, note.created_at]
    );
    notes = mergeSorted(notes, [note], compareNoteRows);
    updateSummary(project.id, { notes: 1 });
    closeModal();
    render();
  } catch (e) {
    unbusy(btn, "Log it");
    hubAlert("Could not save this note.", { description: e.message });
  }
}

async function deleteNote(noteId) {
  const note = notes.find(n => n.id === noteId);
  const ok = await hubConfirm({ message: "Delete this decision?", confirmLabel: "Delete", destructive: true });
  if (!ok) return;
  try {
    await dbWrite("DELETE FROM app_projects__notes WHERE id = ?", [noteId],
      "Only whoever logged this decision can delete it.");
    notes = notes.filter(n => n.id !== noteId);
    if (note) updateSummary(note.project_id, { notes: -1 });
    render();
  } catch (e) {
    hubAlert("Could not delete this note.", { description: e.message });
  }
}

// ── Photos ───────────────────────────────────────────────────────────────────
/**
 * Rewrite a project's photo list as a compare-and-swap.
 *
 * `file_ids` is a whole-column read-modify-write, and `update_file_list_columns`
 * makes the hub RECLAIM any id that drops out of it — the outbox re-derives
 * "still referenced?" from the committed row, so an id no longer listed is
 * deleted from storage, not merely unlinked. A blind write from a stale copy
 * therefore did not just lose the other person's edit, it destroyed their
 * upload: two members each adding a photo meant the second write dropped the
 * first id and the file went with it.
 *
 * The guard is `updated_at`, which is plaintext and so actually comparable —
 * `file_ids` is encrypted (it matches no plaintext suffix), and AES-GCM's
 * random IV means a `WHERE file_ids = ?` guard could never match. A row someone
 * else has touched since our read fails the guard, and we retry against theirs.
 */
const rewritePhotoIds = (project, mutate, refusal) =>
  rewriteFileIds(db, project, mutate, refusal, { live: !!DB, now: nowIso });

async function addPhoto(input) {
  const project = currentProject();
  const file = input?.files?.[0];
  if (!project || !file) return;
  input.disabled = true;
  let uploaded = null;
  try {
    // The DB row is only written once the upload has really resolved — a failed
    // upload must not leave an id in file_ids pointing at nothing.
    const { id: fileId } = await files.upload(file);
    uploaded = fileId;
    await rewritePhotoIds(project, ids => [...ids, fileId], "This photo could not be attached.");
    uploaded = null;
    render();
  } catch (e) {
    // The upload landed but the row never named it, so nothing will ever
    // reclaim it: the file would sit against the household's storage quota
    // forever. Undo our own half.
    if (uploaded) await files.delete(uploaded).catch(() => {});
    input.disabled = false;
    hubAlert("Could not add this photo.", { description: e.message });
  }
}

async function deletePhoto(fileId) {
  const project = currentProject();
  if (!project) return;
  const ok = await hubConfirm({ message: "Remove this photo?", confirmLabel: "Remove", destructive: true });
  if (!ok) return;
  try {
    // `update_file_list_columns` on this column means the hub reclaims the file
    // the moment the UPDATE unlinks it — no client-side delete needed.
    await rewritePhotoIds(project, ids => ids.filter(id => id !== fileId),
      "This photo could not be removed.");
    render();
  } catch (e) {
    hubAlert("Could not remove this photo.", { description: e.message });
  }
}

// ── Window bridge ────────────────────────────────────────────────────────────
// Inline `on*=` attributes are compiled in GLOBAL scope; everything above is
// module-scoped, so each handler needs an explicit assignment here or it throws
// ReferenceError on the first click. build.mjs fails the build if one is missed.
window.closeModal = closeModal;
window.goBackToList = goBack;
window.openProjectById = function(id) { openProject(id); };
window.setTab = function(tab) { currentTab = tab; render(); };
window.loadMoreFor = function(key) {
  const project = currentProject();
  if (project) loadMoreChildren(project.id, key);
};

window.openNewProject = function() {
  openModal(projectForm(null), "project-create-modal");
  setTimeout(() => document.getElementById("f-name")?.focus(), 50);
};
window.openEditProject = function() {
  const project = currentProject();
  if (!project || !canEditProject(project, ME)) return;
  openModal(projectForm(project), "project-edit-modal");
};
window.submitProject = function(isEdit) { saveProject(isEdit); };
window.removeProject = function() { deleteProject(); };

window.openNewBudgetItem = function() {
  openModal(budgetItemForm(null), "budget-item-modal");
  setTimeout(() => document.getElementById("f-label")?.focus(), 50);
};
window.openEditBudgetItem = function(id) {
  const item = budget.find(b => b.id === id);
  if (item) openModal(budgetItemForm(item), "budget-item-modal");
};
window.submitBudgetItem = function(id) { saveBudgetItem(id); };
window.removeBudgetItem = function(id) { deleteBudgetItem(id); };

window.openNewChecklistItem = function() {
  openModal(checklistItemForm(null), "checklist-item-modal");
  setTimeout(() => document.getElementById("f-title")?.focus(), 50);
};
window.openEditChecklistItem = function(id) {
  const item = checklist.find(c => c.id === id);
  if (item) openModal(checklistItemForm(item), "checklist-item-modal");
};
window.submitChecklistItem = function(id) { saveChecklistItem(id); };
window.toggleChecklistItem = function(id) { toggleChecklist(id); };
window.removeChecklistItem = function(id) { deleteChecklistItem(id); };

window.openNewNote = function() {
  openModal(noteForm(), "note-modal");
  setTimeout(() => document.getElementById("f-body")?.focus(), 50);
};
window.submitNote = function() { saveNote(); };
window.removeNote = function(id) { deleteNote(id); };

window.uploadPhoto = function(input) { addPhoto(input); };
window.removePhoto = function(id) { deletePhoto(id); };

// ── Events ───────────────────────────────────────────────────────────────────
// Re-render only the list on each keystroke so the search box keeps focus.
document.addEventListener("input", (event) => {
  if (event.target.id !== "search") return;
  searchQ = event.target.value;
  const list = document.getElementById("project-list");
  if (list) list.innerHTML = renderProjectList();
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && modalEl) closeModal();
});

/**
 * A link into one project — `?projectId=…`, which is what the activity feed and
 * every automation-sent notification hand out.
 *
 * The list is one page of 100 and the rest arrives in the background, so a link
 * to an older project used to find nothing and silently leave the reader on the
 * list — exactly the projects a link is most likely to point at, since finished
 * ones sort last. Waiting for the tail instead would be up to ten round trips
 * to open one project, so the row is fetched by id directly.
 *
 * Row policies answer this read like any other: a project the viewer may not
 * see comes back as no rows, and the link lands on the list — the same as a
 * deleted one, deliberately, since which of the two it is is not the reader's
 * business.
 *
 * It defers to the user. The fetch is a round trip during which someone can
 * tap a card, so the token taken before it is checked after: if the user has
 * navigated in the meantime, the link is dropped rather than yanking them out
 * of what they chose.
 */
async function handleDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const projectId = params.get("projectId");
  if (!projectId) return;
  if (projects.some(p => p.id === projectId)) { await openProject(projectId); return; }
  if (!DB) return;
  const token = nav.peek();
  try {
    const { rows = [] } = await db("SELECT * FROM app_projects__projects WHERE id = ?", [projectId]);
    if (!rows.length || !nav.current(token)) return;
    projects = mergeSorted(projects, rows, compareProjectRows);
    await openProject(projectId);
  } catch {
    // A link that cannot be resolved leaves the reader on the list, which is
    // where they already are. Nothing to report and nothing to retry.
  }
}

(async () => {
  await refresh();
  await handleDeepLink();
})();
</script>
